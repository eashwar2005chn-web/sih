# Required: every dependency in this project is AndroidX. Without this the build fails at
# dataBindingMergeDependencyArtifacts. This file did not exist and had to be created.
android.useAndroidX=true
# No legacy com.android.support dependencies are used, so Jetifier is unnecessary overhead.
android.enableJetifier=false

kotlin.code.style=official
android.nonTransitiveRClass=true

# Modest heap: this build host has 16.5 GB and has already hit commit-limit exhaustion twice
# during concurrent ML training.
org.gradle.jvmargs=-Xmx2048m -Dfile.encoding=UTF-8
org.gradle.parallel=true
